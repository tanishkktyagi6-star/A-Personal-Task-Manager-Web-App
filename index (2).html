<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>📝 TaskFlow</h1>
      <button id="themeToggle" class="icon-btn" title="Toggle dark mode">🌙</button>
    </header>

    <form id="taskForm" class="task-form">
      <input type="text" id="taskTitle" placeholder="What needs to be done?" required />
      <select id="taskCategory">
        <option value="personal">Personal</option>
        <option value="work">Work</option>
        <option value="urgent">Urgent</option>
      </select>
      <input type="date" id="taskDueDate" />
      <button type="submit">Add Task</button>
    </form>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search tasks..." />
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
        <button class="filter-btn" data-filter="work">Work</button>
        <button class="filter-btn" data-filter="personal">Personal</button>
        <button class="filter-btn" data-filter="urgent">Urgent</button>
      </div>
    </div>

    <ul id="taskList" class="task-list"></ul>

    <p id="emptyState" class="empty-state" style="display:none;">No tasks yet — add one above to get started 🚀</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
